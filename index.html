<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동탄중앙초 5학년 1반 안내 도우미</title>
<style>
  :root{
    --ink:#2b2320;
    --paper:#fbf7f0;
    --card:#ffffff;
    --sage:#5b7a5b;
    --sage-deep:#3f5a3f;
    --sage-soft:#e8efe6;
    --clay:#c97b5a;
    --line:#e6ddd0;
    --muted:#8a7d70;
    --bubble-user:#5b7a5b;
    --bubble-bot:#f2ece1;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:
      radial-gradient(1200px 400px at 50% -10%, #f0eadd 0, transparent 60%),
      var(--paper);
    color:var(--ink);
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  .app{
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    height:100vh;
    background:var(--paper);
    box-shadow:0 0 60px rgba(80,60,40,.08);
  }
  /* Header */
  header{
    background:linear-gradient(135deg,var(--sage-deep),var(--sage));
    color:#fff;
    padding:18px 20px 20px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    left:0;right:0;bottom:-1px;
    height:14px;
    background-image:radial-gradient(circle at 10px -4px, var(--paper) 10px, transparent 11px);
    background-size:20px 14px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .avatar{
    width:44px;height:44px;border-radius:50%;
    background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-size:24px;flex-shrink:0;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .brand h1{font-size:17px;font-weight:800;letter-spacing:-.3px;}
  .brand p{font-size:12px;opacity:.85;margin-top:2px;font-weight:500;}
  .status{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;margin-top:8px;opacity:.9;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#a8e6a0;box-shadow:0 0 0 3px rgba(168,230,160,.25);}

  /* Chat area */
  .chat{
    flex:1;
    overflow-y:auto;
    padding:20px 16px 8px;
    display:flex;
    flex-direction:column;
    gap:12px;
    scroll-behavior:smooth;
  }
  .msg{max-width:82%;display:flex;gap:8px;align-items:flex-end;}
  .msg.bot{align-self:flex-start;}
  .msg.user{align-self:flex-end;flex-direction:row-reverse;}
  .msg .bubble{
    padding:12px 15px;
    border-radius:18px;
    font-size:14.5px;
    line-height:1.62;
    word-break:keep-all;
  }
  .msg.bot .bubble{
    background:var(--bubble-bot);
    color:var(--ink);
    border-bottom-left-radius:5px;
  }
  .msg.user .bubble{
    background:var(--bubble-user);
    color:#fff;
    border-bottom-right-radius:5px;
  }
  .msg .mini-avatar{
    width:30px;height:30px;border-radius:50%;
    background:var(--sage-soft);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;flex-shrink:0;
  }
  .bubble strong{color:var(--sage-deep);font-weight:800;}
  .msg.user .bubble strong{color:#fff;}
  .bubble table{width:100%;border-collapse:collapse;margin:8px 0 2px;font-size:13px;}
  .bubble td,.bubble th{border:1px solid var(--line);padding:6px 8px;text-align:center;}
  .bubble th{background:var(--sage-soft);font-weight:700;}
  .bubble .lead{color:var(--muted);font-size:12.5px;}
  .bubble a{color:var(--clay);font-weight:700;text-decoration:none;border-bottom:1.5px solid var(--clay);}
  .inline-chip{
    border:1.5px solid var(--sage);background:var(--card);color:var(--sage-deep);
    padding:7px 12px;border-radius:16px;font-size:13px;font-weight:700;cursor:pointer;
    font-family:inherit;transition:all .15s;
  }
  .inline-chip:hover{background:var(--sage);color:#fff;}
  .note{
    margin-top:8px;padding:8px 10px;background:#fff6ef;
    border-left:3px solid var(--clay);border-radius:6px;
    font-size:12.5px;color:#8a5a3f;
  }

  /* Quick chips */
  .quick{
    padding:6px 16px 12px;
    display:flex;gap:8px;flex-wrap:wrap;
    border-top:1px solid var(--line);
    background:var(--paper);
  }
  .quick .label{
    width:100%;font-size:11px;color:var(--muted);
    margin-bottom:2px;font-weight:600;letter-spacing:.2px;
  }
  .chip{
    border:1.5px solid var(--sage);
    background:var(--card);
    color:var(--sage-deep);
    padding:8px 13px;border-radius:20px;
    font-size:13px;font-weight:600;cursor:pointer;
    transition:all .15s;
    font-family:inherit;
  }
  .chip:hover,.chip:focus{background:var(--sage);color:#fff;outline:none;}
  .chip:active{transform:scale(.96);}

  /* Input */
  .composer{
    display:flex;gap:8px;padding:12px 16px;
    background:var(--card);border-top:1px solid var(--line);
  }
  .composer input{
    flex:1;border:1.5px solid var(--line);border-radius:22px;
    padding:11px 16px;font-size:14px;font-family:inherit;
    background:var(--paper);color:var(--ink);
  }
  .composer input:focus{outline:none;border-color:var(--sage);}
  .composer button{
    background:var(--sage);color:#fff;border:none;
    width:44px;height:44px;border-radius:50%;cursor:pointer;
    font-size:18px;flex-shrink:0;transition:background .15s;
  }
  .composer button:hover{background:var(--sage-deep);}
  .composer button:active{transform:scale(.94);}
  .footer-note{
    text-align:center;font-size:10.5px;color:var(--muted);
    padding:0 0 8px;background:var(--card);
  }
  /* typing */
  .typing span{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--muted);margin:0 1px;animation:blink 1.2s infinite;
  }
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,60%,100%{opacity:.3;}30%{opacity:1;}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="avatar">🌱</div>
      <div>
        <h1>동탄중앙초 5학년 1반 안내 도우미</h1>
        <p>궁금한 걸 물어보시면 바로 알려드려요</p>
      </div>
    </div>
    <div class="status"><span class="dot"></span>학부모님을 위한 실시간 안내 · 2026학년도</div>
  </header>

  <div class="chat" id="chat"></div>

  <div class="quick" id="quick">
    <div class="label">이런 걸 물어보실 수 있어요</div>
  </div>

  <div class="composer">
    <input id="input" type="text" placeholder="예: 5학년 몇 시에 끝나요?" autocomplete="off">
    <button id="send" aria-label="보내기">↑</button>
  </div>
  <div class="footer-note">※ 안내는 참고용입니다. 정확한 확인은 담임 선생님께 문의해 주세요.</div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const quick = document.getElementById('quick');

// ---- 지식 베이스 (5학년 기준) ----
const knowledge = {
  greeting: `안녕하세요, 학부모님 🌱<br>동탄중앙초 <strong>5학년 1반 안내 도우미</strong>예요.<br>준비물·시간표·학사일정·출결신고 등 궁금한 점을 편하게 물어봐 주세요.`,

  },

    html:`<strong>2학기 1주 (8/19 수~8/21 금)</strong> 주간학습이에요.<br>
    <span class="lead">※ 월·화는 여름방학이라 수업이 없어요.</span>

      <tr><th>1</th><td>창체<br>개학식</td><td>사회<br>교과서 톺아보기</td><td>국어<br>독서(4/9)</td></tr>

    · 8/27(목) 3~4교시 <strong>2학기 학급임원 선거</strong><br>
    · 등하굣길 교통안전·규칙적인 생활 습관 회복 부탁드려요</div>

    html:`<strong>2학기 2주 (8/24 월~8/28 금)</strong> 주간학습이에요.<br>

  counsel:{
    keys:['상담','상담신청','상담 신청','면담','상담일','담임 상담'],
    html:`<strong>학부모 상담 신청 안내</strong>예요.<br>
    ① 아래 <strong>학교 홈페이지</strong>에서 상담 신청서(hwpx)를 내려받아 주세요.<br>
    ② 인적사항·희망일시(<strong>3순위까지</strong>)·상담방식(대면/전화)·상담내용을 작성해 주세요.<br>
    ③ 작성한 신청서를 자녀 편에 담임 선생님께 제출하면 됩니다.<br>
    <div class="note">📄 <a href="https://dtc-e.goehs.kr/dtc-e/na/ntt/selectNttInfo.do?mi=5433&bbsId=2692&nttSn=1240637" target="_blank" rel="noopener">상담 사전 신청서 받기 (학교 홈페이지) →</a><br>
    · 대면 상담 시 1층 중앙현관 안전지킴이실에서 방문증을 패용해 주세요.<br>
    · 전화 상담은 신청서의 보호자 번호로 담임이 연락드려요.</div>`
  },

  event_days:{
    keys:['공개수업','설명회','학부모총회','참관','운동회','체육한마당','발표회','행사'],
    html:`<strong>학부모 관련 주요 행사</strong>예요.<br>
    · 3.18(수) 학교설명회·학부모총회·<strong>공개수업의 날</strong><br>
    · 9.16(수) 어울림 체육한마당 (1·2·3학년) / 9.17(목) (4·5·6학년)<br>
    · 12.23~27 교육활동발표회<br>
    <span class="lead">개별 상담을 원하시면 "상담"이라고 입력해 주세요.</span>`
  },

  fieldtrip:{
    keys:['현장체험','체험학습','견학','소풍','보고서','현장'],
    html:`<strong>현장체험학습(교외체험학습) 안내</strong>예요.<br>
    ① 아래 <strong>NEIS 학부모서비스</strong>에 접속 후 로그인해 주세요.<br>
    ② <strong>[민원신청 → 교외체험학습]</strong>에서 신청서를 온라인 제출!<br>
    ③ 다녀온 뒤에는 같은 메뉴에서 <strong>보고서</strong>를 제출해 주세요.<br>
    · 허가받은 기간을 초과하면 결석 처리되니 기간을 꼭 확인해 주세요.<br>
    <div class="note">✍️ <a href="https://parents.neis.go.kr/csp-prnt/#/prn-main/intro" target="_blank" rel="noopener">NEIS 학부모서비스 바로가기 →</a></div>`
  },

  lunch:{
    keys:['점심','급식','밥','식단','메뉴'],
    html:`<strong>5학년 점심시간</strong>은 <strong>13:00~13:50</strong> (2부)예요.<br>
    <span class="lead">급식 식단표는 학교 홈페이지 또는 배움터 앱에서 확인하실 수 있어요. 급식 관련 알레르기 등은 담임 선생님과 영양 선생님께 문의해 주세요.</span>`
  },

  contact:{
    keys:['연락','전화','문의','담임','선생님','상담 신청','번호'],
    html:`<strong>문의 안내</strong>예요.<br>
    · 급한 사안은 <strong>담임 선생님</strong>께 직접 연락 부탁드려요.<br>
    · 출결 관련 업무: 교무기획부<br>
    <span class="lead">연락처와 상담 가능 시간은 학기 초 안내문 또는 알림장을 참고해 주세요.</span>`
  }
};

const order = ['w1','w2','weekly','end_time','weekly_hours','counsel','absence','late','fieldtrip','calendar','event_days','lunch','contact'];

const chips = [
  {label:'이번 주 주간학습', q:'weekly'},
  {label:'5학년 몇 시에 끝나요?', q:'end_time'},
  {label:'결석 신고', q:'absence'},
  {label:'현장체험학습 제출', q:'fieldtrip'},
  {label:'상담 신청', q:'counsel'},
  {label:'방학은 언제예요?', q:'calendar'},
];

function addMsg(html, who){
  const m = document.createElement('div');
  m.className = 'msg ' + who;
  const av = who==='bot' ? `<div class="mini-avatar">🌱</div>` : '';
  m.innerHTML = `${av}<div class="bubble">${html}</div>`;
  chat.appendChild(m);
  chat.scrollTop = chat.scrollHeight;
  return m;
}

function typing(){
  const m = document.createElement('div');
  m.className='msg bot';
  m.innerHTML=`<div class="mini-avatar">🌱</div><div class="bubble typing"><span></span><span></span><span></span></div>`;
  chat.appendChild(m);
  chat.scrollTop = chat.scrollHeight;
  return m;
}

function findAnswer(text){
  const t = text.replace(/\s/g,'');
  for(const key of order){
    const entry = knowledge[key];
    if(!entry.keys) continue;
    for(const k of entry.keys){
      if(t.includes(k.replace(/\s/g,''))) return entry.html;
    }
  }
  return null;
}

function respond(text){
  const t = typing();
  setTimeout(()=>{
    t.remove();
    const ans = findAnswer(text);
    if(ans){
      addMsg(ans,'bot');
    }else{
      addMsg(`아직 그 질문은 제가 정확히 답변드리기 어려워요 🙏<br>
      아래 버튼에서 골라 보시거나, <strong>담임 선생님</strong>께 문의해 주세요.<br>
      <span class="lead">준비물·주간학습·상담신청서·현장체험 폼은 곧 추가될 예정이에요.</span>`,'bot');
    }
  }, 550);
}

function send(text){
  if(!text.trim()) return;
  addMsg(text.replace(/</g,'&lt;'),'user');
  respond(text);
  input.value='';
}

// build chips
chips.forEach(c=>{
  const b=document.createElement('button');
  b.className='chip';
  b.textContent=c.label;
  b.onclick=()=>{ addMsg(c.label,'user'); const t=typing(); setTimeout(()=>{t.remove();addMsg(knowledge[c.q].html,'bot');},500); };
  quick.appendChild(b);
});

document.getElementById('send').onclick=()=>send(input.value);
input.addEventListener('keydown',e=>{ if(e.key==='Enter') send(input.value); });

// inline chips (week selector inside bubbles)
chat.addEventListener('click', e=>{
  const btn = e.target.closest('.inline-chip');
  if(!btn) return;
  const wk = btn.dataset.week;
  const labelMap = {w1:'1주 (8/19~21)', w2:'2주 (8/24~28)'};
  addMsg(labelMap[wk],'user');
  const t=typing();
  setTimeout(()=>{ t.remove(); addMsg(knowledge[wk].html,'bot'); },500);
});

// greeting + 이번 주 안내 자동 표시
setTimeout(()=>{
  addMsg(knowledge.greeting,'bot');
  setTimeout(()=>{
    addMsg(`먼저 <strong>이번 주 안내</strong>를 보여드릴게요 👇`,'bot');
    setTimeout(()=>addMsg(knowledge.w1.html,'bot'), 600);
  }, 800);
}, 300);
</script>
